<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Pesquisa SenaiTEC</title>
    </head>
<body>
    <header>
        <h1>Pesquisa SenaiTEC</h1>
    </header>
    <section>  
        <fieldset>
        <form action="index.html" method="get">
            
                <legend>Dados da Pesquisa</legend>
            <label for="userName">Nome:</label>

            <input type="text" name="userName" id="'userName" required>
            <br>


            <label for="userAge">Idade:</label> 
            <input type="number" name="userAge" id="userAge" required
            min="12" max="100">
            <br>

            <label for="userbirthDate">Ano de Nascimento:</label> 
            <input type="date" name="userBirthDate" id="userBirthDate">
            <br>

            <label for="userEmail">Email:</label> 
            <input type="email" name="userEmail" id="userEmail"
            required>
            <br>
  
            <label for="userPhone">Telefone:</label> 
            <input type="tel" name="userPhone" id="userPhone" pattern="[0-9]{11}" placeholder="(21) 9873-2034">
            <br>

            <label for="userImage">Upload da Foto:</label> 
            <input type="file" name="userImage" id="userImage">
            <br>
            <button type="submit">Enviar</button>
            <br>

            </fieldset>
        </form>
    </section>
</body>
</html>
